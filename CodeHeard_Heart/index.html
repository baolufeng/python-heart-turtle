<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="心迹 Echo of Light：一颗由代码生成、可以被听见的爱心。"
    />
    <title>心迹 · Echo of Light</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-grain" aria-hidden="true"></div>

    <div class="app">
      <header class="site-header">
        <a class="brand" href="#" aria-label="心迹作品首页">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
          </span>
          <span class="brand-copy">
            <strong>CODE / HEARD</strong>
            <small>把代码，写成心跳</small>
          </span>
        </a>

        <div class="header-meta">
          <span class="edition">FIRST EDITION · 2026</span>
          <button
            class="camera-toggle"
            id="cameraToggle"
            type="button"
            aria-pressed="false"
            aria-controls="cameraConsole"
            aria-label="开启摄像头手势识别"
          >
            <span class="camera-icon" aria-hidden="true"></span>
            <span class="action-label" id="cameraLabel">手势识别</span>
          </button>
          <button
            class="sound-toggle"
            id="soundToggle"
            type="button"
            aria-pressed="false"
            aria-label="开启声音"
          >
            <span class="sound-bars" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
            <span class="action-label" id="soundLabel">声音 · 关</span>
          </button>
        </div>
      </header>

      <main class="hero" aria-label="心迹互动爱心作品">
        <section class="hero-copy">
          <p class="eyebrow">
            <span class="eyebrow-line"></span>
            <span id="chapterLabel">CODE · HEART · LIGHT</span>
          </p>

          <div class="title-wrap" id="titleWrap">
            <h1>
              <span id="titleLineOne">心迹</span>
              <span class="title-accent" id="titleLineTwo"></span>
            </h1>
          </div>

          <p class="lead" id="leadText">
            代码织爱，心自成光。
          </p>

          <div class="hero-actions">
            <button class="primary-action" id="pulseButton" type="button">
              <span class="action-heart" aria-hidden="true">♥</span>
              <span>让心动</span>
              <span class="action-arrow" aria-hidden="true">↗</span>
            </button>
          </div>
        </section>

        <section class="heart-stage" aria-label="实时粒子爱心">
          <canvas
            id="heartCanvas"
            aria-label="一颗由粒子组成、持续跳动的爱心。点击画面可与爱心互动。"
          ></canvas>
          <canvas id="volumeCanvas" aria-hidden="true"></canvas>
          <canvas id="frontCanvas" aria-hidden="true"></canvas>

          <div class="orbit-caption orbit-caption-top" aria-hidden="true">
            <span class="caption-index">01</span>
            <span>ORBITAL HEART<br />心迹投影</span>
          </div>
          <div class="orbit-caption orbit-caption-bottom" aria-hidden="true">
            <span class="caption-index">∞</span>
            <span>LIGHT / MOTION<br />光与心动</span>
          </div>

          <div class="heart-status" aria-live="polite">
            <span class="status-pulse" aria-hidden="true"></span>
            <span id="statusText">心跳 72 BPM</span>
          </div>
        </section>
      </main>

    </div>

    <aside class="camera-console" id="cameraConsole" hidden aria-label="摄像头手势识别">
      <div class="camera-console-head">
        <span class="camera-title"><i></i> GESTURE VISION</span>
        <button class="camera-close" id="cameraClose" type="button" aria-label="关闭摄像头">×</button>
      </div>

      <div class="camera-viewport">
        <video id="handVideo" muted playsinline aria-label="摄像头画面"></video>
        <canvas id="handOverlay" aria-hidden="true"></canvas>
        <div class="camera-loading" id="cameraLoading">
          <span class="loading-ring" aria-hidden="true"></span>
          <span id="cameraLoadingText">正在准备摄像头</span>
          <button class="camera-retry" id="cameraRetry" type="button" hidden>重试摄像头</button>
        </div>
        <span class="camera-privacy">LOCAL ONLY · 画面不上传</span>
      </div>

      <div class="gesture-result">
        <span class="gesture-symbol" id="gestureSymbol">○</span>
        <span class="gesture-copy">
          <small>当前手势</small>
          <strong id="gestureName">等待识别</strong>
        </span>
        <span class="gesture-lock" id="gestureLock">STANDBY</span>
      </div>

      <div class="gesture-map" aria-label="手势操作说明">
        <span><b>☝</b>循环换色</span>
        <span><b>✊</b>星环心</span>
        <span><b>✌</b>丝线心</span>
        <span><b>✋</b>粉雾心</span>
      </div>
      <p class="camera-note">食指循环换色，粉色优先；拳头、V、张手分别切换三种形态。手势保持约 1 秒后生效。</p>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">请开启 JavaScript，让这颗心开始跳动。</p>
    </noscript>
    <script src="./app.js"></script>
  </body>
</html>
